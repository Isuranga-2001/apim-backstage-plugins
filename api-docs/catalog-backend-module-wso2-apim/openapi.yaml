  /api/am/publisher/v4/apis/{apiId}/wsdl:
    get:
      tags:
        - Publisher
      summary: Get API WSDL definition
      operationId: getPublisherApiWsdl
      description: |
        Gets the WSDL definition for SOAP and SOAP-to-REST APIs.

        The catalog WSO2 provider calls this endpoint while syncing SOAP APIs and stores the text WSDL response on the `wso2.com/api-wsdl` entity annotation when available. If WSO2 returns a ZIP archive instead of text WSDL, the provider skips storing it in the catalog annotation.
      x-codeSamples:
        - lang: curl
          label: Get WSDL definition
          source: |
            curl -k 'https://localhost:9447/api/am/publisher/v4/apis/{apiId}/wsdl' \
              -H "Authorization: Bearer $WSO2_ACCESS_TOKEN" \
              -H "Accept: application/wsdl+xml, text/xml, application/xml, application/zip, */*" \
              -o '{apiId}-wsdl'
      parameters:
        - $ref: '#/components/parameters/ApiId'
      responses:
        '200':
          description: |
            API WSDL definition.

            Returns the WSDL definition for SOAP and SOAP-to-REST APIs. Can be returned as a plain XML document or as a ZIP file.
          content:
            application/wsdl+xml:
              schema:
                type: string
              examples:
                CountryInfoService:
                  $ref: '#/components/examples/CountryInfoServiceWsdl'
            text/xml:
              schema:
                type: string
              examples:
                CountryInfoService:
                  $ref: '#/components/examples/CountryInfoServiceWsdl'
            application/xml:
              schema:
                type: string
              examples:
                CountryInfoService:
                  $ref: '#/components/examples/CountryInfoServiceWsdl'
            application/zip:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
              examples:
                CountryInfoService:
                  $ref: '#/components/examples/CountryInfoServiceWsdl'
        '404':
          $ref: '#/components/responses/Wso2Error'
        '500':
          description: Internal server error while retrieving the WSDL definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wso2Error'
              examples:
                generalError:
                  summary: General Error (e.g. for non-SOAP APIs)
                  value:
                    code: 900967
                    message: 'General Error'
                    description: 'Server Error Occurred'
                    moreInfo: ''
                    error: []
                internalServerError:
                  summary: Internal Server Error
                  value:
                    code: 500
                    message: 'Internal server error'
                    description: 'Error while retrieving WSDL of API : b779100d-982b-4771-b329-ce05a3c98b67'
                    moreInfo: ''
                    error: []
