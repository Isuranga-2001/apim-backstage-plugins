              -u "$WSO2_USERNAME:$WSO2_PASSWORD" \
              -H 'Content-Type: application/json' \
              -d '{
                "keyType": "PRODUCTION",
                "keyName": "backstage-key",
                "validityPeriod": 345600,
                "additionalProperties": {
                  "permittedIP": "192.168.1.1",
                  "permittedReferer": ""
                }
              }'
      parameters:
        - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keyType:
                  type: string
                  enum:
                    - PRODUCTION
                    - SANDBOX
                  example: PRODUCTION
                keyName:
                  type: string
                  example: backstage-key
                validityPeriod:
                  type: integer
                  description: Validity period in seconds. Use -1 for keys that never expire.
                  example: 345600
                additionalProperties:
                  type: object
                  properties:
                    permittedIP:
                      type: string
                      description: Optional IP address restriction. Send an empty string when not used.
