openapi: 3.0.3
info:
  title: WSO2 APIM Catalog Backend Module Dependencies
  version: 1.0.0
  description: >
    Outbound WSO2 APIs consumed by the catalog-backend-module-wso2-apim plugin
    while discovering APIs, API products, MCP servers, services, global settings,
    and self-hosted gateway APIs.

    Direct OpenAPI YAML: [catalog-backend-module-wso2-apim.yaml](./catalog-backend-module-wso2-apim.yaml)

    Postman collection: [catalog-backend-module-wso2-apim.postman_collection.json](../postman/catalog-backend-module-wso2-apim.postman_collection.json)
servers:
  - url: https://localhost:9447
    description: Local WSO2 API Manager base URL from WSO2_BASE_URL in 4.7.0.env.
tags:
  - name: OAuth
  - name: Publisher
  - name: DevPortal
  - name: Service Catalog
  - name: Gateway Discovery
paths:
  /oauth2/token:
    post:
      tags:
        - OAuth
      summary: Exchange client credentials for a WSO2 access token
      description: |
        Exchanges client credentials for a WSO2 access token. 

        **Important:** The client credentials must belong to an application owned/subscribed by a user with appropriate roles/permissions (such as `admin` or a publisher role) to authorize the requested scopes.

        The scopes are categorized by task:
        * **Core API Ingestion:** `apim:api_view apim:publisher_settings`
        * **Advanced Ingestion & Publishing:** `apim:api_create apim:api_publish apim:api_import_export`
        * **MCP Server Ingestion:** `apim:mcp_server_view apim:mcp_server_create apim:mcp_server_publish apim:mcp_server_generate_key apim:mcp_server_import_export apim:mcp_server_list_view apim:llm_provider_read`
      operationId: getWso2AccessToken
      x-codeSamples:
        - lang: curl
          label: Get access token (All Scopes)
          source: |
            curl -k -X POST 'https://localhost:9447/oauth2/token' \
              -u "$WSO2_CLIENT_ID:$WSO2_CLIENT_SECRET" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=client_credentials' \
              --data-urlencode 'scope=apim:api_view apim:publisher_settings apim:api_create apim:api_publish apim:api_import_export apim:mcp_server_view apim:mcp_server_create apim:mcp_server_publish apim:mcp_server_generate_key apim:mcp_server_import_export apim:mcp_server_list_view apim:llm_provider_read'
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                scope:
                  type: string
                  description: |
                    Space-separated list of scopes to request. Ensure the client credentials possess roles/permissions that allow requesting these scopes.
                  example: apim:api_view apim:publisher_settings apim:api_create apim:api_publish apim:api_import_export apim:mcp_server_view apim:mcp_server_create apim:mcp_server_publish apim:mcp_server_generate_key apim:mcp_server_import_export apim:mcp_server_list_view apim:llm_provider_read
      responses:
        '200':
          description: OAuth token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad request (e.g. missing grant type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
                error_description: Missing grant_type parameter value
        '401':
          description: Unauthorized (e.g. invalid client credentials).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_client
                error_description: Client credentials are invalid.
