  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      scheme: basic
    GatewayManagementApiAuth:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    ApiId:
      name: apiId
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    McpId:
      name: mcpId
      in: path
      required: true
      schema:
        type: string
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
  responses:
    Wso2Error:
      description: WSO2 error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wso2Error'
        text/plain:
          schema:
            type: string
  schemas:
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid_client
        error_description:
          type: string
          example: Client credentials are invalid.
      additionalProperties: true
    TokenResponse:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
