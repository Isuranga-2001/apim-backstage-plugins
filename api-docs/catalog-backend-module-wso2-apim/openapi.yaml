  /api/am/publisher/v4/apis:
    get:
      tags:
        - Publisher
      summary: List APIs from WSO2 Publisher
      description: |
        The catalog backend reads this endpoint in pages using `limit=1000` and an increasing `offset` value until all Publisher APIs have been collected. API details, documents, and Swagger/AsyncAPI definitions are then enriched with bounded concurrency before the provider applies one full catalog mutation.
      operationId: listPublisherApis
      x-codeSamples:
        - lang: curl
          label: List APIs
          source: |
            curl -k 'https://localhost:9447/api/am/publisher/v4/apis?limit=1000&offset=0' \
              -H "Authorization: Bearer $WSO2_ACCESS_TOKEN"
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of API summaries to return per page. The catalog backend uses 1000.
          schema:
            type: integer
            default: 1000
        - name: offset
          in: query
          required: false
          description: Zero-based offset of the first API summary to return. The catalog backend increments this by the number of APIs returned on each page.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: API list.
