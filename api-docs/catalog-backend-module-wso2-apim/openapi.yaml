            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                openapi: 3.0.1
                info:
                  title: product
                  version: v1
                servers:
                  - url: /
                security:
                  - default: []
                paths:
                  /*:
                    get:
                      responses:
                        '200':
                          description: OK
                      security:
                        - default: []
                      x-auth-type: Application & Application User
                      x-throttling-tier: Unlimited
                    put:
                      responses:
                        '200':
                          description: OK
                      security:
                        - default: []
                      x-auth-type: Application & Application User
                      x-throttling-tier: Unlimited
                  /menu:
                    get:
                      tags:
                        - menu
                      description: Return a list of available menu items
                      operationId: getMenu
                      responses:
                        '200':
                          description: OK. List of APIs is returned.
                          content:
                            application/json:
                              schema:
                                type: array
                                items:
                                  $ref: '#/components/schemas/MenuItem'
                        '406':
                          description: Not Acceptable. The requested media type is not supported
                          content:
                            application/json:
                              schema:
                                $ref: '#/components/schemas/Error'
                      security:
                        - default:
                            - rewrew
                      x-auth-type: Application & Application User
                      x-throttling-tier: Unlimited
                components:
                  schemas:
                    ErrorListItem:
                      title: Description of individual errors that may have occurred during a request.
                      required:
                        - code
                        - message
                      properties:
                        message:
                          type: string
                          description: Description about individual errors occurred
                        code:
                          type: integer
                          format: int64
                    Error:
                      title: Error object returned with 4XX HTTP status
                      required:
                        - code
                        - message
                      properties:
                        message:
                          type: string
                          description: Error message.
                        error:
                          type: array
                          description: If there are more than one error list them out. Ex. list out validation errors by each field.
                          items:
                            $ref: '#/components/schemas/ErrorListItem'
                        description:
                          type: string
                          description: A detail description about the error message.
                        code:
                          type: integer
                          format: int64
                        moreInfo:
                          type: string
                          description: Preferably an url with more details about the error.
                    MenuItem:
                      title: Pizza menu Item
                      required:
                        - name
                      properties:
