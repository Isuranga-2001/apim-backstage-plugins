openapi: 3.0.3
info:
  title: WSO2 API Manager Backstage Plugin API Collection
  version: 1.0.0
  description: >
    Internal Backstage backend API exposed by the wso2-api-platform-backend
    plugin. The frontend wso2-api-platform plugin consumes these endpoints.

    Direct OpenAPI YAML: [wso2-api-platform-backend.yaml](./wso2-api-platform-backend.yaml)

    Postman collection: [wso2-api-platform-backend.postman_collection.json](../postman/wso2-api-platform-backend.postman_collection.json)
servers:
  - url: http://localhost:7007/api/wso2-api-platform
    description: Local Backstage backend URL from BACKEND_BASE_URL plus the WSO2 API Manager plugin route.
  - url: /api/wso2-api-platform
    description: Relative Backstage discovery base URL for the WSO2 API Manager backend plugin.
security:
  - Wso2AccessTokenAuth: []
  - {}
tags:
  - name: Health
  - name: Catalog
  - name: Gateways
  - name: APIs
  - name: Services
  - name: Documents
paths:
  /refresh:
    post:
      tags:
        - Catalog
      summary: Request a catalog refresh
      operationId: refreshWso2Catalog
      x-codeSamples:
        - lang: curl
          label: Refresh catalog
          source: |
            curl -X POST 'http://localhost:7007/api/wso2-api-platform/refresh' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN"
      parameters:
        - $ref: '#/components/parameters/Wso2AccessToken'
      responses:
        '200':
          description: Refresh request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                accepted:
                  value:
                    message: Catalog refresh triggered. This may take a few moments to reflect in the catalog.
        '500':
          $ref: '#/components/responses/JsonError'
  /apis/{apiId}/generate-key:
    post:
      tags:
        - APIs
      summary: Generate an API key
      operationId: generateWso2ApiKey
      x-codeSamples:
        - lang: curl
          label: Generate API key
          source: |
            curl -X POST 'http://localhost:7007/api/wso2-api-platform/apis/{apiId}/generate-key' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{
                "keyName": "backstage-key",
                "keyType": "PRODUCTION",
                "validityPeriod": 345600,
                "additionalProperties": {
                  "permittedIP": "192.168.1.1",
                  "permittedReferer": ""
                }
              }'
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/Wso2AccessToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateApiKeyRequest'
            examples:
              preferredIp:
                value:
                  keyName: backstage-key
                  keyType: PRODUCTION
                  validityPeriod: 345600
                  additionalProperties:
                    permittedIP: 192.168.1.1
                    permittedReferer: ''
              preferredReferer:
                value:
                  keyName: backstage-referer-key
                  keyType: SANDBOX
                  validityPeriod: 15552000
                  additionalProperties:
                    permittedIP: ''
                    permittedReferer: https://example.com
      responses:
        '200':
          description: API key generation response returned by WSO2 DevPortal.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/JsonError'
  /apis/{apiId}/revisions:
    get:
      tags:
        - APIs
      summary: List API revisions
      operationId: listWso2ApiRevisions
      x-codeSamples:
        - lang: curl
          label: List API revisions
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/apis/{apiId}/revisions?query=' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN"
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/Wso2AccessToken'
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Optional WSO2 Publisher search query.
      responses:
        '200':
          description: API revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wso2ApiRevisionsResponse'
        '500':
          $ref: '#/components/responses/JsonError'
  /services:
    get:
      tags:
        - Services
      summary: List service catalog services
      operationId: listWso2Services
      x-codeSamples:
        - lang: curl
          label: List services
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/services?limit=1000&offset=0' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN"
      parameters:
        - $ref: '#/components/parameters/Wso2AccessToken'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: WSO2 Service Catalog service list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                list:
                  - id: 340d7c69-7a93-4b82-8d09-aaa3dee4d404
                    name: Pizzashack-Endpoint
                    description: A Catalog Entry that exposes a REST endpoint
                    version: v1
                    serviceKey: Pizzashack-Endpoint-1.0.0
                    serviceUrl: https://localhost:9443/am/sample/pizzashack/v1/api
                    definitionType: OAS3
                    securityType: NONE
                    mutualSSLEnabled: false
                    usage: 2
                    createdTime: '2026-06-04 06:10:55.497'
                    lastUpdatedTime: '2026-06-04 06:10:55.497'
                    md5: '{"hash":"b80fcd8e06b9c977bc7d11799df206de19a851b86e23340a8edc3cb37e2f1672","algorithm":"SHA-256"}'
                    definitionUrl: null
                pagination:
                  offset: 0
                  limit: 1000
                  total: 1
                  next: ''
                  previous: ''
        '500':
          $ref: '#/components/responses/JsonError'
  /services/{serviceId}/usage:
    get:
      tags:
        - Services
      summary: Get service usage
      operationId: getWso2ServiceUsage
      x-codeSamples:
        - lang: curl
          label: Get service usage
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/services/{serviceId}/usage' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN"
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Wso2AccessToken'
      responses:
        '200':
          description: Service usage returned by WSO2 Service Catalog.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                count: 2
                list:
                  - id: b23c8513-efe1-4d76-b02a-f08d9e1fb9cc
                    name: endpoint1
                    displayName: null
                    context: /endpoint1/v1
                    version: v1
                    provider: admin
                  - id: 7cfff040-eec1-4cde-9921-50bdaff24e8e
                    name: Pizzashack-Endpoint2
                    displayName: null
                    context: /apiprod2/v1
                    version: v1
                    provider: admin
        '500':
          $ref: '#/components/responses/JsonError'
  /services/{serviceId}/definition:
    get:
      tags:
        - Services
      summary: Get a service definition
      operationId: getWso2ServiceDefinition
      x-codeSamples:
        - lang: curl
          label: Get service definition
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/services/{serviceId}/definition' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN"
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Wso2AccessToken'
      responses:
        '200':
          description: Raw service definition content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/yaml:
              schema:
                type: string
              example: |
                openapi: 3.0.0
                info:
                  description: |
                    This is a RESTFul API for Pizza Shack online pizza delivery store.
                  version: 1.0.0
                  title: PizzaShackAPI
                  contact:
                    name: John Doe
                    url: http://www.pizzashack.com
                    email: architecture@pizzashack.com
                  license:
                    name: Apache 2.0
                    url: http://www.apache.org/licenses/LICENSE-2.0.html
                servers:
                  - url: https://localhost:9443/am/sample/pizzashack/v1/api
                    description: Local PizzaShack service endpoint
                paths:
                  /menu:
                    get:
                      summary: List available pizzas
                      operationId: listPizzas
                      responses:
                        '200':
                          description: Available pizza menu.
                          content:
                            application/json:
                              schema:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Pizza'
                  /orders:
                    post:
                      summary: Create a pizza order
                      operationId: createOrder
                      requestBody:
                        required: true
                        content:
                          application/json:
                            schema:
                              $ref: '#/components/schemas/Order'
                      responses:
                        '201':
                          description: Order created.
                          content:
                            application/json:
                              schema:
                                $ref: '#/components/schemas/Order'
                components:
                  schemas:
                    Pizza:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        price:
                          type: number
                          format: double
                    Order:
                      type: object
                      required:
                        - pizzaId
                        - quantity
                      properties:
                        id:
                          type: string
                        pizzaId:
                          type: string
                        quantity:
                          type: integer
                          minimum: 1
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/TextError'
  /apis/{apiId}/wsdl:
    get:
      tags:
        - APIs
      summary: Stream an API WSDL document
      operationId: getWso2ApiWsdl
      x-codeSamples:
        - lang: curl
          label: Download WSDL
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/apis/{apiId}/wsdl' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN" \
              -o '{apiId}-wsdl'
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - $ref: '#/components/parameters/Wso2AccessToken'
      responses:
        '200':
          description: WSDL content or archive streamed from WSO2 Publisher.
          content:
            application/xml:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                format: binary
            text/xml:
              schema:
                type: string
        '204':
          description: WSO2 returned no response body.
        '4XX':
          description: Error response proxied from WSO2.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/TextError'
  /apis/{apiId}/documents/{documentId}/content:
    get:
      tags:
        - APIs
      summary: Stream API document content
      operationId: getWso2ApiDocumentContent
      x-codeSamples:
        - lang: curl
          label: Download API document
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/apis/{apiId}/documents/{documentId}/content' \
              -H "X-WSO2-Access-Token: $WSO2_ACCESS_TOKEN" \
              -o 'document-{documentId}'
      parameters:
        - $ref: '#/components/parameters/ApiId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Wso2AccessToken'
      responses:
        '200':
          description: API document content. Inline WSO2 documents may be returned as text.
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '204':
          description: WSO2 returned no response body.
        '404':
          description: Document content was not found and no inline fallback was available.
          content:
            text/plain:
              schema:
                type: string
        '4XX':
          description: Error response proxied from WSO2.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/TextError'
  /entities/{kind}/{namespace}/{name}/documents:
    get:
      tags:
        - Documents
      summary: List documents for an entity
      description: >
        Routes to the plugin-owned document store for self-hosted/OpenChoreo
        gateway APIs, or to the read-only on-prem APIM store, based on the
        entity's discovery-type annotations.
      operationId: listWso2EntityDocuments
      x-codeSamples:
        - lang: curl
          label: List documents
          source: |
            curl 'http://localhost:7007/api/wso2-api-platform/entities/api/wso2-gateways/orders-api/documents'
      parameters:
        - $ref: '#/components/parameters/EntityKind'
        - $ref: '#/components/parameters/EntityNamespace'
        - $ref: '#/components/parameters/EntityName'
      responses:
        '200':
          description: Documents and store capabilities for this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentListResponse'
        '404':
          $ref: '#/components/responses/JsonError'
        '500':
          $ref: '#/components/responses/JsonError'
    post:
      tags:
        - Documents
      summary: Create a document
      description: >
        Only supported for self-hosted/OpenChoreo gateway APIs (see
        `capabilities.create` on the list response) — on-prem APIM APIs
        return 403. Accepts `application/json` for INLINE/MARKDOWN/URL
        documents, or `multipart/form-data` (fields `metadata`, `file`) for
        FILE documents.
      operationId: createWso2EntityDocument
      x-codeSamples:
        - lang: curl
          label: Create a markdown document
          source: |
            curl -X POST 'http://localhost:7007/api/wso2-api-platform/entities/api/wso2-gateways/orders-api/documents' \
              -H 'Content-Type: application/json' \
              -d '{
                "name": "Getting Started",
                "type": "HOWTO",
                "sourceType": "MARKDOWN",
                "inlineContent": "# Getting Started"
              }'
      parameters:
        - $ref: '#/components/parameters/EntityKind'
        - $ref: '#/components/parameters/EntityNamespace'
        - $ref: '#/components/parameters/EntityName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiDocumentRequest'
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
                - file
              properties:
                metadata:
                  description: JSON-encoded CreateApiDocumentRequest with sourceType FILE.
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocument'
        '400':
          $ref: '#/components/responses/JsonError'
        '403':
          $ref: '#/components/responses/JsonError'
        '404':
          $ref: '#/components/responses/JsonError'
        '409':
          $ref: '#/components/responses/JsonError'
        '413':
          $ref: '#/components/responses/JsonError'
        '501':
          $ref: '#/components/responses/JsonError'
  /entities/{kind}/{namespace}/{name}/documents/{documentId}:
    get:
      tags:
        - Documents
      summary: Get one document's metadata
      operationId: getWso2EntityDocument
      parameters:
        - $ref: '#/components/parameters/EntityKind'
        - $ref: '#/components/parameters/EntityNamespace'
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocument'
        '404':
          $ref: '#/components/responses/JsonError'
    put:
      tags:
        - Documents
      summary: Update document metadata
      description: >
        Metadata only — `sourceType`, `inlineContent`, `fileName` and file
        parts are rejected. `sourceUrl` is only accepted when the stored
        document's sourceType is URL.
      operationId: updateWso2EntityDocumentMetadata
      parameters:
        - $ref: '#/components/parameters/EntityKind'
        - $ref: '#/components/parameters/EntityNamespace'
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiDocumentMetadataRequest'
      responses:
        '200':
          description: Updated document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocument'
        '400':
          $ref: '#/components/responses/JsonError'
        '403':
          $ref: '#/components/responses/JsonError'
        '404':
          $ref: '#/components/responses/JsonError'
        '409':
          $ref: '#/components/responses/JsonError'
    delete:
      tags:
        - Documents
      summary: Hard-delete a document
      operationId: deleteWso2EntityDocument
      parameters:
        - $ref: '#/components/parameters/EntityKind'
        - $ref: '#/components/parameters/EntityNamespace'
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Document deleted.
        '403':
          $ref: '#/components/responses/JsonError'
        '404':
          $ref: '#/components/responses/JsonError'
  /entities/{kind}/{namespace}/{name}/documents/{documentId}/content:
    get:
      tags:
        - Documents
      summary: Get document content
      description: >
        Streams FILE/INLINE/MARKDOWN content, or responds `303 See Other`
        with a `Location` header for URL documents.
      operationId: getWso2EntityDocumentContent
      parameters:
        - $ref: '#/components/parameters/EntityKind'
        - $ref: '#/components/parameters/EntityNamespace'
        - $ref: '#/components/parameters/EntityName'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document content.
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '303':
          description: Redirect to the document's source URL.
        '404':
          $ref: '#/components/responses/JsonError'
components:
  securitySchemes:
    Wso2AccessTokenAuth:
      type: apiKey
      in: header
      name: X-WSO2-Access-Token
      description: Optional WSO2 access token. If omitted, the backend may use the configured service account token.
  parameters:
    ApiId:
      name: apiId
      in: path
      required: true
      schema:
        type: string
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
    EntityKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
      example: api
    EntityNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
      example: wso2-gateways
    EntityName:
      name: name
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    Wso2AccessToken:
      name: X-WSO2-Access-Token
      in: header
      required: false
      schema:
        type: string
      description: Optional WSO2 access token. If omitted, the backend may use the configured service account token.
  responses:
    JsonError:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            failed:
              value:
                message: 'WSO2 API request failed [401]: Unauthorized'
    TextError:
      description: Request failed.
      content:
        text/plain:
          schema:
            type: string
          examples:
            failed:
              value: Error streaming document content
  schemas:
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    GenerateApiKeyRequest:
      type: object
      properties:
        keyName:
          type: string
        keyType:
          type: string
          enum:
            - PRODUCTION
            - SANDBOX
          default: PRODUCTION
        validityPeriod:
          type: integer
          description: Validity period in seconds. Use -1 for keys that never expire.
          example: 345600
        additionalProperties:
          type: object
          properties:
            permittedIP:
              type: string
              description: Optional IP address restriction. Send an empty string when not used.
              example: 192.168.1.1
            permittedReferer:
              type: string
              description: Optional HTTP referrer restriction. Send an empty string when not used.
              example: ''
          additionalProperties: true
    Wso2ApiRevision:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
        description:
          type: string
        createdTime:
          type: string
        deploymentInfo:
          type: array
          items:
            type: object
            required:
              - name
              - vhost
              - displayOnDevportal
              - deployedTime
            properties:
              name:
                type: string
              vhost:
                type: string
              displayOnDevportal:
                type: boolean
              deployedTime:
                type: string
    Wso2ApiRevisionsResponse:
      type: object
      required:
        - count
        - list
      properties:
        count:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/Wso2ApiRevision'
    ApiDocumentCapabilities:
      type: object
      required:
        - read
        - create
        - updateMetadata
        - updateContent
        - delete
      properties:
        read:
          type: boolean
        create:
          type: boolean
        updateMetadata:
          type: boolean
        updateContent:
          type: boolean
          description: Always false in this release — content updates are not yet supported.
        delete:
          type: boolean
    ApiDocument:
      type: object
      required:
        - documentId
        - name
        - type
        - sourceType
      properties:
        documentId:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - HOWTO
            - SAMPLES
            - PUBLIC_FORUM
            - SUPPORT_FORUM
            - API_MESSAGE_FORMAT
            - OTHER
        otherTypeName:
          type: string
          description: Required when type is OTHER.
        summary:
          type: string
        sourceType:
          type: string
          enum:
            - INLINE
            - MARKDOWN
            - URL
            - FILE
        sourceUrl:
          type: string
          description: Present when sourceType is URL.
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        createdBy:
          type: string
        createdTime:
          type: string
        lastUpdatedBy:
          type: string
        lastUpdatedTime:
          type: string
    ApiDocumentListResponse:
      type: object
      required:
        - count
        - list
        - capabilities
      properties:
        count:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/ApiDocument'
        capabilities:
          $ref: '#/components/schemas/ApiDocumentCapabilities'
    CreateApiDocumentRequest:
      type: object
      required:
        - name
        - type
        - sourceType
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum:
            - HOWTO
            - SAMPLES
            - PUBLIC_FORUM
            - SUPPORT_FORUM
            - API_MESSAGE_FORMAT
            - OTHER
        otherTypeName:
          type: string
          description: Required when type is OTHER.
        summary:
          type: string
        sourceType:
          type: string
          enum:
            - INLINE
            - MARKDOWN
            - URL
            - FILE
        sourceUrl:
          type: string
          description: Required when sourceType is URL.
        inlineContent:
          type: string
          description: Required when sourceType is INLINE or MARKDOWN.
    UpdateApiDocumentMetadataRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum:
            - HOWTO
            - SAMPLES
            - PUBLIC_FORUM
            - SUPPORT_FORUM
            - API_MESSAGE_FORMAT
            - OTHER
        otherTypeName:
          type: string
        summary:
          type: string
        sourceUrl:
          type: string
          description: Only accepted when the stored document's sourceType is URL.
